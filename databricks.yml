# This is a Declarative Automation Bundle definition for databricks_free_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_free_demo
  uuid: 65af5ad3-fae3-4257-ba57-bf419dae25e9

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1345f388-285a.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
    git:
      origin_url: https://github.com/santol5946/databricks_free_demo.git
      branch: main
  prod:
    mode: production
    workspace:
      host: https://dbc-1345f388-285a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/68012c78-2cf0-41de-94e2-21b6ed0cbe6e to make sure we only have a single copy.
      root_path: /Workspace/Users/68012c78-2cf0-41de-94e2-21b6ed0cbe6e/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - service_principal_name: 68012c78-2cf0-41de-94e2-21b6ed0cbe6e
        level: CAN_MANAGE
    git:
      origin_url: https://github.com/santol5946/databricks_free_demo.git
      branch: main
